services:
  db:
    image: postgres:16-alpine
    container_name: sti-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env (ejecuta npm run setup)}
      POSTGRES_DB: ${POSTGRES_DB:-sti}
      TZ: ${ZONA_HORARIA:-America/Caracas}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - sti_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sti} -d ${POSTGRES_DB:-sti}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  sti_pgdata:
